<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad1)" stroke="#1e40af" stroke-width="1"/>
  
  <!-- Bot icon -->
  <g fill="white">
    <!-- Head -->
    <rect x="8" y="6" width="16" height="12" rx="3"/>
    
    <!-- Eyes -->
    <circle cx="12" cy="10" r="1.5" fill="#1e40af"/>
    <circle cx="20" cy="10" r="1.5" fill="#1e40af"/>
    
    <!-- Mouth -->
    <path d="M 12 14 Q 16 16 20 14" stroke="#1e40af" stroke-width="1" fill="none"/>
    
    <!-- Antenna -->
    <line x1="16" y1="6" x2="16" y2="3" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="16" cy="2" r="1.5" fill="#1e40af"/>
    
    <!-- Body -->
    <rect x="10" y="18" width="12" height="8" rx="2"/>
    
    <!-- Arms -->
    <rect x="6" y="20" width="4" height="2" rx="1"/>
    <rect x="22" y="20" width="4" height="2" rx="1"/>
  </g>
  
  <!-- Calendar icon overlay -->
  <g transform="translate(18, 18)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#22c55e" stroke="#16a34a" stroke-width="0.5"/>
    <rect x="1" y="3" width="10" height="8" fill="white"/>
    <line x1="3" y1="0" x2="3" y2="3" stroke="#16a34a" stroke-width="0.5"/>
    <line x1="9" y1="0" x2="9" y2="3" stroke="#16a34a" stroke-width="0.5"/>
    <circle cx="4" cy="6" r="0.5" fill="#16a34a"/>
    <circle cx="6" cy="6" r="0.5" fill="#16a34a"/>
    <circle cx="8" cy="6" r="0.5" fill="#16a34a"/>
    <circle cx="4" cy="8" r="0.5" fill="#16a34a"/>
    <circle cx="6" cy="8" r="0.5" fill="#16a34a"/>
    <circle cx="8" cy="8" r="0.5" fill="#16a34a"/>
  </g>
</svg>
